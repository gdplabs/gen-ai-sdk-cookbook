[project]
name = "hello-world-local"
version = "0.1.0"
description = "Hello World - Local agent execution without server deployment"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "glaip-sdk[privacy,memory]",
    "aip-agents-binary>=0.6.57",
    "gllm-evals[deepeval,ragas]==0.1.8",
    "agentevals>=0.0.8,<0.0.9",
    "openevals>=0.1.0,<0.2.0",
    "langchain-core>=1.2.22",
    "langsmith>=0.7.31,<0.8.0",
    "python-dotenv>=1.0.0,<2.0.0",
]

[tool.uv]
package = false
index-strategy = "unsafe-best-match"
prerelease = "allow"

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
name = "gen-ai-internal"
url = "https://glsdk.gdplabs.id/gen-ai-internal/simple/"

[[tool.uv.index]]
name = "gen-ai"
url = "https://us-central1-python.pkg.dev/gen-ai-internal-421607/gen-ai-internal/simple"

[tool.uv.sources]
gllm-core = { index = "gen-ai-internal" }
gllm-inference = { index = "gen-ai-internal" }
gllm-datastore = { index = "gen-ai-internal" }
gllm-retrieval = { index = "gen-ai-internal" }
gllm-generation = { index = "gen-ai-internal" }
gllm-pipeline = { index = "gen-ai-internal" }
gllm-evals = { index = "gen-ai-internal" }