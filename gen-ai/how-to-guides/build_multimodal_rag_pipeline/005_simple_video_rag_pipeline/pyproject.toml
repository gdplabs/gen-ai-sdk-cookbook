[project]
name = "video-search-pipeline"
version = "0.0.0"
description = "Video search RAG pipeline — index a YouTube video by transcript segments and search with timestamped retrieval"
requires-python = ">=3.11,<3.13"
readme = "README.md"
dependencies = [
    "gllm-core>=0.4.0,<0.5.0",
    "gllm-retrieval>=0.6.0,<0.6.5",
    "gllm-generation>=0.6.9,<0.7.0",
    "gllm-multimodal[audio]>=0.3.0,<0.4.0",
    "python-dotenv>=1.0.0,<2.0.0",
]

[[tool.uv.index]]
name = "gen-ai-internal"
url = "https://glsdk.gdplabs.id/gen-ai-internal/simple/"

[tool.uv.sources]
gllm-core = { index = "gen-ai-internal" }
gllm-inference = { index = "gen-ai-internal" }
gllm-datastore = { index = "gen-ai-internal" }
gllm-retrieval = { index = "gen-ai-internal" }
gllm-generation = { index = "gen-ai-internal" }
gllm-pipeline = { index = "gen-ai-internal" }
gllm-multimodal = { index = "gen-ai-internal" }
