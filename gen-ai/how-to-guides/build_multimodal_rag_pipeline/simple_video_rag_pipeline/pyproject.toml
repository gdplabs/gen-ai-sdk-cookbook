[project]
name = "simple_video_rag_pipeline"
version = "0.0.0"
description = "simple_video_rag_pipeline usage example"
requires-python = ">=3.11,<3.14"
readme = "README.md"
dependencies = [
    "gllm-core>=0.3.0,<0.5.0",
    "gllm-datastore>=0.5.0,<0.6.0",
    "gllm-inference>=0.6.0,<0.7.0",
    "gllm-multimodal>=0.6.0,<0.7.0",
]

[[tool.uv.index]]
name = "gen-ai-internal"
url = "https://glsdk.gdplabs.id/gen-ai-internal/simple/"

[tool.uv.sources]
gllm-core = { index = "gen-ai-internal" }
gllm-datastore = { index = "gen-ai-internal" }
gllm-inference = { index = "gen-ai-internal" }
gllm-multimodal = { index = "gen-ai-internal" }
