[project]
name = "contextual-image-captioning"
version = "0.0.0"
description = "Contextual image captioning pipeline — enrich image captions with surrounding section text for more grounded retrieval"
requires-python = ">=3.11,<3.13"
readme = "README.md"
dependencies = [

    "gllm-core>=0.4.41,<0.5.0",
    "gllm-retrieval==0.6.7",
    "gllm-generation>=0.6.17,<0.7.0",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "python-dotenv>=1.0.0,<2.0.0",
    ]

    

[[tool.uv.index]]
name = "gen-ai-internal"
url = "https://glsdk.gdplabs.id/gen-ai-internal/simple/"

[tool.uv.sources]
gllm-core = { index = "gen-ai-internal" }
gllm-inference = { index = "gen-ai-internal" }
gllm-datastore = { index = "gen-ai-internal" }
gllm-retrieval = { index = "gen-ai-internal" }
gllm-generation = { index = "gen-ai-internal" }
gllm-pipeline = { index = "gen-ai-internal" }
gllm-multimodal = { index = "gen-ai-internal" }
gllm-docproc = { index = "gen-ai-internal" }
