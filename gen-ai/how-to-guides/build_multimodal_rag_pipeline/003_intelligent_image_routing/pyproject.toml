[project]
name = "smart-image-routing"
version = "0.0.0"
description = "Smart image routing RAG pipeline — classify images at index time and route each to the right converter"
requires-python = ">=3.11,<3.13"
readme = "README.md"
dependencies = [

    "gllm-core>=0.4.41,<0.5.0",
    "gllm-retrieval>=0.6.7,<0.7.0",
    "gllm-generation>=0.6.17.post1,<0.7.0",
    "gllm-docproc[pdf,image]>=0.12.9,<0.13.0",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "python-dotenv>=1.0.0,<2.0.0",
    "gllm-pipeline[aurelio-image]>=0.5.19,<0.6.0",
    "gllm-multimodal>=0.3.38,<0.4.0",
    

[tool.uv]
# semantic-router[vision] pins pillow<11; gllm-docproc[image] requires pillow>=12.1.1.
# Override until semantic-router relaxes the vision extra constraint (CVE-2026-42208 yanks).
override-dependencies = ["pillow>=12.1.1"]

[[tool.uv.index]]
name = "gen-ai-internal"
url = "https://glsdk.gdplabs.id/gen-ai-internal/simple/"

[tool.uv.sources]
gllm-core = { index = "gen-ai-internal" }
gllm-inference = { index = "gen-ai-internal" }
gllm-datastore = { index = "gen-ai-internal" }
gllm-retrieval = { index = "gen-ai-internal" }
gllm-generation = { index = "gen-ai-internal" }
gllm-pipeline = { index = "gen-ai-internal" }
gllm-multimodal = { index = "gen-ai-internal" }
gllm-docproc = { index = "gen-ai-internal" }