[project]
name = "database-backed-checkpointing"
version = "0.0.0"
description = "Persist pipeline checkpoints to a gllm-datastore BaseDataStore via DataStoreSaver"
requires-python = ">=3.11,<3.13"
readme = "README.md"
dependencies = [
    "gllm-core>=0.4.43,<0.5.0",
    "gllm-inference>=0.6.111,<0.7.0",
    "gllm-pipeline[datastore]>=0.5.20,<0.6.0",
    # [chroma] is required because gllm_datastore's package __init__ eagerly imports
    # ChromaDataStore even when only InMemoryDataStore is used.
    "gllm-datastore[chroma]>=0.5.96,<0.6.0",
]

[[tool.uv.index]]
name = "gen-ai-internal"
url = "https://glsdk.gdplabs.id/gen-ai-internal/simple/"

[tool.uv.sources]
gllm-core = { index = "gen-ai-internal" }
gllm-inference = { index = "gen-ai-internal" }
gllm-pipeline = { index = "gen-ai-internal" }
gllm-datastore = { index = "gen-ai-internal" }
