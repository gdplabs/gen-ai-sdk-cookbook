[project]
name = "pipeline-error-fallback"
version = "0.0.0"
description = "Pipeline error fallback example"
requires-python = ">=3.11,<3.13"
dependencies = [
    "gllm-core==0.4.43",
    "gllm-pipeline==0.5.20",
]

[[tool.uv.index]]
name = "gen-ai-internal"
url = "https://glsdk.gdplabs.id/gen-ai-internal/simple/"

[tool.uv.sources]
gllm-core = { index = "gen-ai-internal" }
gllm-pipeline = { index = "gen-ai-internal" }
