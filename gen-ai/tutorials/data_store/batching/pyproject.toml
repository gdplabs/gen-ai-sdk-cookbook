[project]
name = "batching"
version = "0.0.0"
description = "batching usage example"
requires-python = ">=3.11,<3.14"
readme = "README.md"
dependencies = [
    "chromadb>=1.0.0",
    "gllm-datastore>=0.5.0,<0.6.0",
    "gllm-inference[openai]>=0.6.0,<0.7.0",
]

[[tool.uv.index]]
name = "gen-ai-internal"
url = "https://glsdk.gdplabs.id/gen-ai-internal/simple/"

[tool.uv.sources]
gllm-datastore = { index = "gen-ai-internal" }
gllm-inference = { index = "gen-ai-internal" }
