[project]
name = "data-store"
version = "0.0.0"
description = "Data store blob capability example"
requires-python = ">=3.12,<3.14"
readme = "README.md"
dependencies = [
    "gllm-core>=0.4.37,<0.5.0",
    "gllm-datastore[chroma,object-storage]>=0.5.110,<0.6.0",
    "python-dotenv>=1.0.0,<2.0.0",
]

[[tool.uv.index]]
name = "gen-ai-internal"
url = "https://glsdk.gdplabs.id/gen-ai-internal/simple/"

[tool.uv.sources]
gllm-core = { index = "gen-ai-internal" }
gllm-datastore = { index = "gen-ai-internal" }
