[project]
name = "basic_crud_and_methods"
version = "0.0.0"
description = "basic_crud_and_methods usage example"
requires-python = ">=3.11,<3.14"
readme = "README.md"
dependencies = [
    "chromadb>=1.0.0",
    "gllm-core>=0.3.0,<0.5.0",
    "gllm-datastore>=0.5.0,<0.6.0",
]

[[tool.uv.index]]
name = "gen-ai-internal"
url = "https://glsdk.gdplabs.id/gen-ai-internal/simple/"

[tool.uv.sources]
gllm-core = { index = "gen-ai-internal" }
gllm-datastore = { index = "gen-ai-internal" }
