[project]
name = "input_mapping"
version = "0.0.0"
description = "input_mapping usage example"
requires-python = ">=3.11,<3.14"
readme = "README.md"
dependencies = [
    "gllm-core>=0.3.0,<0.5.0",
    "gllm-pipeline>=0.6.0,<0.7.0",
]

[[tool.uv.index]]
name = "gen-ai-internal"
