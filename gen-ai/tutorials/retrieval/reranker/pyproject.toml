[project]
name = "reranker"
version = "0.0.0"
description = "Reranker usage example"
requires-python = ">=3.11,<3.14"
readme = "README.md"
dependencies = [
    "gllm-retrieval>=0.5.0,<0.6.0",
    "gllm-inference[openai]>=0.6.115,<0.7.0",
    "python-dotenv>=1.0.0,<2.0.0",
]

[[tool.uv.index]]
name = "gen-ai-internal"
url = "https://glsdk.gdplabs.id/gen-ai-internal/simple/"

[tool.uv.sources]
gllm-retrieval = { index = "gen-ai-internal" }
gllm-inference = { index = "gen-ai-internal" }
