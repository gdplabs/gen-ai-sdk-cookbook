[project]
name = "generation-response-synthesizer"
version = "0.0.0"
description = "Response Synthesizer usage examples"
requires-python = ">=3.11,<3.14"
readme = "README.md"
dependencies = [
    "gllm-core>=0.4.42,<0.7.0",
    "gllm-generation[openai]>=0.6.19,<0.7.0",
    "gllm-inference[openai]>=0.6.106,<0.7.0",
    "python-dotenv>=1.0.0,<2.0.0",
]

[[tool.uv.index]]
name = "gen-ai-internal"
url = "https://glsdk.gdplabs.id/gen-ai-internal/simple/"

[tool.uv.sources]
gllm-core = { index = "gen-ai-internal" }
gllm-generation = { index = "gen-ai-internal" }
gllm-inference = { index = "gen-ai-internal" }