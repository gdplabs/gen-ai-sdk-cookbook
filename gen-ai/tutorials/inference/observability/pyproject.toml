[project]
name = "inference-observability"
version = "0.0.0"
description = "gllm_inference.observability trace content capture example"
requires-python = ">=3.11,<3.14"
readme = "README.md"
dependencies = [
    "gllm-inference[openai]>=0.6.145.post1,<0.7.0",
    "opentelemetry-sdk",
]

[[tool.uv.index]]
name = "gen-ai-internal"
url = "https://glsdk.gdplabs.id/gen-ai-internal/simple/"

[tool.uv.sources]
gllm-inference = { index = "gen-ai-internal" }
