[project]
name = "inference-dm-invoker"
version = "0.0.0"
description = "Decisions Model (DM) Invoker usage examples"
requires-python = ">=3.11,<3.14"
readme = "README.md"
dependencies = [
    "gllm-core>=0.4.49",
    "gllm-inference[typesafe]>=0.6.163,<0.7.0",
    "python-dotenv>=1.2.2,<2.0.0",
]

[[tool.uv.index]]
name = "gen-ai-internal"
url = "https://glsdk.gdplabs.id/gen-ai-internal/simple/"

[tool.uv.sources]
gllm-core = { index = "gen-ai-internal" }
gllm-inference = { index = "gen-ai-internal" }
