[project]
name = "evaluate-suites-gsheets-tutorial"
version = "0.0.0"
description = "Evaluate Suites from Google Sheets tutorial for GenAI Evaluator SDK"
requires-python = ">=3.11,<3.14"
readme = "README.md"
dependencies = [
    "python-dotenv>=1.0.0,<2.0.0",
    "gllm-evals[deepeval,langchain,ragas]>=0.1.18,<0.2.0",
    "gllm-inference>=0.6.0",
]

[[tool.uv.index]]
name = "gen-ai-internal"
url = "https://glsdk.gdplabs.id/gen-ai-internal/simple/"

[tool.uv.sources]
gllm-evals = { index = "gen-ai-internal" }
gllm-inference = { index = "gen-ai-internal" }
