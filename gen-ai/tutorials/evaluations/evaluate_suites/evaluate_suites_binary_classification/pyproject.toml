[project]
name = "evaluate-suites-binary-classification"
version = "0.1.0"
description = "Example: evaluate_suites with binary classification (TPR/TNR) run aggregators"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0.0,<2.0.0",
    "gllm-evals[deepeval,langchain]>=0.1.23,<0.2.0",
    "gllm-inference>=0.6.0",
]

[[tool.uv.index]]
name = "gen-ai-internal"
url = "https://glsdk.gdplabs.id/gen-ai-internal/simple/"

[tool.uv.sources]
gllm-evals = { index = "gen-ai-internal" }
gllm-inference = { index = "gen-ai-internal" }
