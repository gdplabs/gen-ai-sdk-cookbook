name: custom-judge-model-and-metrics-suite

data:
  - input: "What is the capital of France?"
    actual_output: "Paris is the capital of France."
    expected_output: "Paris"
    retrieved_context: "Paris is the capital of France."
  - input: "What is the capital of Japan?"
    actual_output: "Kyoto"
    expected_output: "Tokyo"
    retrieved_context: "Tokyo is the capital of Japan."

evaluators:
  - class_name: CompositeEvaluator
    name: deterministic_checks
    metrics:
      - class_path: metrics.custom_metrics.ExactMatchMetric
        name: exact_match_from_path
      - class_name: RegisteredKeywordMatchMetric
        name: keyword_match_from_registry

  - class_name: GEvalGenerationEvaluator
    models:
      - model_id: openrouter/deepseek/deepseek-v4.1-flash-1017
        credentials: ${OPENROUTER_API_KEY}
        config:
          provider:
            order: [inference.net]
            allow_fallbacks: false
    fallback_models:
      - model_id: openrouter/openai/gpt-6-luna
        credentials: ${OPENROUTER_API_KEY}
        config:
          provider:
            order: [openai]
            allow_fallbacks: false
    metrics:
      - class_name: GEvalCompletenessMetric
        threshold: 0.8
