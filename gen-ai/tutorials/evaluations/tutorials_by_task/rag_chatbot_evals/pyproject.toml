readme = "README.md"
dependencies = [
    "python-dotenv>=1.0.0,<2.0.0",
    "gllm-evals[deepeval,langchain,ragas]>=0.1.23,<0.2.0",
    "gllm-inference>=0.6.64",
]

[[tool.uv.index]]
