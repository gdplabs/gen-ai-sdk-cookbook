[project]
name = "metrics"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.0.0,<2.0.0",
    "gllm-evals[deepeval,langchain,ragas]>=0.1.41,<0.2.0",
]

[tool.uv]
# gllm-evals' `ragas` extra pulls in instructor, which requires openai<3, while gllm-inference
# requires openai>=3.26. gllm-evals uses the same override in its own pyproject.toml.
# Remove it when gllm-evals[ragas] resolves without it.
override-dependencies = ["openai>=3.26.0,<4.0.0"]

[[tool.uv.index]]
name = "gen-ai-internal"
url = "https://glsdk.gdplabs.id/gen-ai-internal/simple/"

[tool.uv.sources]
gllm-evals = { index = "gen-ai-internal" }

[tool.pytest.ini_options]
pythonpath = ["."]
