[project]
name = "using-decision-model-as-judge-in-gllm-evals"
version = "0.0.0"
description = "Tutorial: Using a decision model as a GEval judge and escalating low-confidence results"
requires-python = ">=3.11,<3.14"
readme = "README.md"
dependencies = [
    "gllm-evals[deepeval]>=0.1.32,<0.2.0",
    "gllm-inference[openai,typesafe]>=0.6.164,<0.7.0",
]

[[tool.uv.index]]
name = "gen-ai-internal"
url = "https://glsdk.gdplabs.id/gen-ai-internal/simple/"

[tool.uv.sources]
gllm-evals = { index = "gen-ai-internal" }
gllm-inference = { index = "gen-ai-internal" }
