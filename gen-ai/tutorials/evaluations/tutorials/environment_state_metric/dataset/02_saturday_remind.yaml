name: saturday-remind

data:
  - id: tc-saturday-remind
    description: Verify the Saturday reminder schedule.
    input: >
      Execute the employee_weekly_report_orchestrator tool with these exact
      parameters: mode='remind', group_names=['report_group']. Send reminders
      to complete the current weekly report. Do not ask for confirmation.
    expected_tools:
      - name: employee_weekly_report_orchestrator
        input_parameters:
          mode: remind
          group_names:
            - report_group
    expected_emails:
      - subject:
          contains:
            - "Reminder"
          excludes:
            - "Error Log Report"
        content:
          contains:
            - "This is a friendly reminder to complete your weekly report before the due date."
        docs:
          title:
            contains: []

evaluators:
  - class_name: CompositeEvaluator
    name: saturday-remind
    metrics:
      - class_path: evals.metrics.email_sent_verification.EmailSentVerificationMetric
      - class_path: evals.metrics.docs_content_verification.DocsContentVerificationMetric