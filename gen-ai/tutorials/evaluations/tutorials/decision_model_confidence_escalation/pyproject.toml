[project]
name = "decision-model-confidence-escalation"
version = "0.0.0"
description = "Tutorial: Escalating low-confidence GEval results from a decision model"
requires-python = ">=3.11,<3.14"
readme = "README.md"
dependencies = [
    "python-dotenv>=1.0.0,<2.0.0",
    "gllm-evals[deepeval]",
    "gllm-inference[openai,typesafe]>=0.6.164,<0.7.0",
]

[[tool.uv.index]]
name = "gen-ai-internal"
url = "https://glsdk.gdplabs.id/gen-ai-internal/simple/"

[tool.uv.sources]
# Decision model support is unreleased: GDP-ADMIN/gl-sdk#7160 (branch feat/gllm-evals-dm-capability-phase1).
gllm-evals = { git = "https://github.com/GDP-ADMIN/gl-sdk.git", rev = "c962ec793e08e965d57a908b9a5c60892cb7147d", subdirectory = "libs/gllm-evals" }
gllm-inference = { index = "gen-ai-internal" }
