[project]
name = "custom-prompts-with-fewshot-and-info"
version = "0.0.0"
description = "Tutorial: Custom evaluation prompts using fewshot and additional_info"
requires-python = ">=3.11,<3.14"
readme = "README.md"
dependencies = [
    "python-dotenv>=1.0.0,<2.0.0",
    "gllm-evals[deepeval]>=0.1.18,<0.2.0",
    "gllm-inference[google]>=0.6.115,<0.7.0",
]

[[tool.uv.index]]
name = "gen-ai-internal"
url = "https://glsdk.gdplabs.id/gen-ai-internal/simple/"

[tool.uv.sources]
gllm-evals = { index = "gen-ai-internal" }
gllm-inference = { index = "gen-ai-internal" }
