[project]
name = "switching-judge-model-tutorial"
version = "0.0.0"
description = "Switch the gllm-evals judge model at the metric, evaluator, and suite levels"
requires-python = ">=3.11,<3.14"
readme = "README.md"
dependencies = [
    "gllm-evals[deepeval]>=0.1.24,<0.2.0",
    "gllm-inference[google,openai]>=0.6.115,<0.7.0",
    "python-dotenv>=1.0.0,<2.0.0",
]

[[tool.uv.index]]
name = "gen-ai-internal"
url = "https://glsdk.gdplabs.id/gen-ai-internal/simple/"

[tool.uv.sources]
gllm-evals = { index = "gen-ai-internal" }
gllm-inference = { index = "gen-ai-internal" }
