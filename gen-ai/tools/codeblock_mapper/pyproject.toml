[project]
name = "codeblock-mapper"
version = "0.1.0"
description = "Maps GitBook codeblock IDs to their gen-ai-sdk-cookbook source regions."
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["codeblock_mapper"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F"]
